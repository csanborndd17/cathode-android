name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CATHODE_RELEASE_KEYSTORE_BASE64: ${{ secrets.CATHODE_RELEASE_KEYSTORE_BASE64 }}
      CATHODE_KEYSTORE_PASSWORD: ${{ secrets.CATHODE_KEYSTORE_PASSWORD }}
      CATHODE_KEY_ALIAS: ${{ secrets.CATHODE_KEY_ALIAS }}
      CATHODE_KEY_PASSWORD: ${{ secrets.CATHODE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate platform parity ledger
        run: python3 -m json.tool docs/parity.json > /dev/null

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cathode-debug-keystore-v1

      - name: Test and assemble debug APK
        run: bash gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Restore release signing key
        if: ${{ env.CATHODE_RELEASE_KEYSTORE_BASE64 != '' && env.CATHODE_KEYSTORE_PASSWORD != '' && env.CATHODE_KEY_ALIAS != '' && env.CATHODE_KEY_PASSWORD != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/cathode-signing"
          printf '%s' "$CATHODE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cathode-signing/cathode-release.jks"
          chmod 600 "$RUNNER_TEMP/cathode-signing/cathode-release.jks"

      - name: Assemble signed release APK
        if: ${{ env.CATHODE_RELEASE_KEYSTORE_BASE64 != '' && env.CATHODE_KEYSTORE_PASSWORD != '' && env.CATHODE_KEY_ALIAS != '' && env.CATHODE_KEY_PASSWORD != '' }}
        env:
          CATHODE_KEYSTORE_FILE: ${{ runner.temp }}/cathode-signing/cathode-release.jks
        run: bash gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cathode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: ${{ env.CATHODE_RELEASE_KEYSTORE_BASE64 != '' && env.CATHODE_KEYSTORE_PASSWORD != '' && env.CATHODE_KEY_ALIAS != '' && env.CATHODE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cathode-release-apk
          path: app/build/outputs/apk/release/app-release.apk
